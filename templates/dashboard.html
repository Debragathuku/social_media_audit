<!DOCTYPE html>
<html>
<head>
    <title>Social Media Audit Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

<h2>Social Media Audit Dashboard</h2>

<div class="row mt-4">
    <div class="col-md-4"><h4>Total Posts: {{ total }}</h4></div>
    <div class="col-md-4"><h4>Hate Speech: {{ hate }}</h4></div>
    <div class="col-md-4"><h4>Cyberbullying: {{ cyber }}</h4></div>
    <div class="col-md-4"><h4>Fraud: {{ fraud }}</h4></div>
    <div class="col-md-4"><h4>Violence: {{ violence }}</h4></div>
    <div class="col-md-4"><h4>Clean: {{ clean }}</h4></div>
</div>

<h3 class="mt-4">Posts Table</h3>
{{ table|safe }}

</body>
</html>
